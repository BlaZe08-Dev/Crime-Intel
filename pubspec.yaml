name: crime_intel
description: "AI-Powered Criminal Network Analysis System (Flutter Windows Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite & Desktop Storage
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2

  # Security, Cryptography & Hashing
  crypto: ^3.0.3

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - .env.example
