analyzer:
  exclude:
    - build/**
    - windows/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: false # Permitted for CLI / desktop logging
    prefer_final_fields: true
    use_build_context_synchronously: false

    # Enum values in this project are SCREAMING_CASE because they are a
    # persistence format, not just identifiers: `LogActor.name` and
    # `LogAction.name` are written into `log_entries` and hashed into the
    # audit chain (docs/Schema.md section 8), and the same names appear in
    # docs/Schema.md for every other enum. Renaming them to lowerCamelCase
    # would invalidate every existing chain and break `fromString` on any
    # database written before the rename. The lint is off deliberately.
    constant_identifier_names: false
